<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeurAeon Technologies | Home</title>
    <style>
        :root {
            --primary: #008080;
            --dark: #1a1a1a;
            --light-bg: #f9fafb;
            --text: #374151;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            color: var(--text);
            background-color: white;
        }

        /* --- NAVIGATION BASE --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 10%;
            border-bottom: 1px solid #eee;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img {
            height: 45px;
            width: auto;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-wrap: wrap; /* Allows wrapping on small screens */
            gap: 2rem;
            margin: 0;
            padding: 0;
            justify-content: flex-end;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* --- DROPDOWN LOGIC --- */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none; /* Keeps links hidden until hover */
            position: absolute;
            background-color: white;
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
            z-index: 1001;
            top: 100%;
            left: 0;
            border-radius: 4px;
            border: 1px solid #eee;
            padding: 10px 0;
        }

        .dropdown-content a {
            color: var(--text);
            padding: 12px 20px;
            display: block; /* Stacks links vertically */
            font-size: 0.9rem;
        }

        .dropdown-content a:hover {
            background-color: var(--light-bg);
            color: var(--primary);
        }

        /* Shows menu on hover */
        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Dropdown Arrow */
        .dropdown > a::after {
            content: ' ▼';
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* --- MOBILE RESPONSIVE RULES --- */
        @media (max-width: 768px) {
            nav {
                flex-direction: column; /* Logo on top, menu below */
                padding: 1rem 5%;
            }

            .logo {
                margin-bottom: 1rem;
            }

            .nav-links {
                justify-content: center; /* Centers links on mobile */
                gap: 1rem;
                width: 100%;
            }

            .nav-links li {
                font-size: 0.85rem;
            }

            /* Adjust dropdown for touch screens */
            .dropdown-content {
                position: static; /* Pushes content down instead of floating */
                box-shadow: none;
                border: none;
                background-color: var(--light-bg);
                width: 100%;
                text-align: center;
            }
        }

        /* --- PAGE LAYOUT --- */
        .hero {
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, var(--light-bg) 100%);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--dark);
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 1.2rem;
            color: #4b5563;
        }

        footer {
            margin-top: 100px;
            padding: 40px 20px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 0.9rem;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            <img src="IMG_8634_1_70.jpeg" alt="NeurAeon Technologies Logo">
        </div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li class="dropdown">
                <a href="about.html">About</a>
                <div class="dropdown-content">
                    <a href="about.html">Our Mission</a>
                    <a href="item_one.html">Technology</a>
                    <a href="item_two.html">Research</a>
                </div>
            </li>
            <li><a href="meet_the_team.html">Meet The Team</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <h2>In Progress</h2>
    <footer>
        &copy; 2025 NeurAeon Technologies. All rights reserved.
    </footer>

</body>

</html>
