<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | NeurAeon Technologies</title>
    <style>
        :root {
            --primary: #008080;
            --dark: #1a1a1a;
            --light-bg: #f9fafb;
            --text: #374151;
            --input-border: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            color: var(--text);
            background-color: white;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 10%;
            border-bottom: 1px solid #eee;
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        /* Contact Layout */
        .contact-header {
            padding: 60px 20px 20px;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, var(--light-bg) 100%);
        }

        .contact-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr; /* Form is wider than info */
            gap: 60px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--dark);
            margin-bottom: 10px;
        }

        /* Form Styling */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
        }

        input, textarea {
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.1);
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* Info Styling */
        .info-card {
            background-color: var(--light-bg);
            padding: 40px;
            border-radius: 12px;
            height: fit-content;
        }

        .info-item {
            margin-bottom: 25px;
        }

        .info-item h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .info-item p {
            margin: 0;
            font-size: 1rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
            nav {
                padding: 1rem 5%;
                flex-direction: column;
                gap: 1rem;
            }
        }

        footer {
            margin-top: 60px;
            padding: 40px 20px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 0.9rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <img src="IMG_8634_1_70.jpeg" alt="NeurAeon Technologies Logo">
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="meet_the_team.html">Meet The Team</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <header class="contact-header">
        <h1>Contact Us</h1>
        <p>Have questions about our neurotechnology? We'd love to hear from you.</p>
    </header>

    <main class="contact-container">
        <section>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>

        <aside class="info-card">
            <div class="info-item">
                <h3>General Inquiries</h3>
                <p>neuraeon527@gmail.com</p>
            </div>
			<div class="info-item">
				<h3>Phone</h3>
				<p>(816) 647-5512</p>
           
            <div class="info-item">
                <h3>Follow Us</h3>
                <p>LinkedIn | Twitter</p>
            </div>
        </aside>
        <aside><img src="607583747_818353204557356_4758216285830343040_n_1_35.jpg" alt="contact photo" ></aside>
    </main>

    <footer>
        &copy; 2025 NeurAeon Technologies. All rights reserved.
    </footer>

</body>
</html>
